[package]
name = "wordglide"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Offline incremental English dictionary with immediate definition preview"
default-run = "wordglide"
repository = "https://github.com/starfield17/wordglide"
homepage = "https://github.com/starfield17/wordglide"
readme = "README.md"
keywords = ["dictionary", "tui", "offline", "english", "wiktionary"]
categories = ["command-line-utilities"]
publish = ["crates-io"]
include = [
    "/Cargo.toml", "/Cargo.lock", "/src/**/*.rs", "/tests/**/*.rs",
    "/tests/fixtures/*.json",
    "/examples/sample/*.json", "/examples/sample/*.jsonl",
    "/README.md", "/LICENSE", "/THIRD_PARTY.md", "/CHANGELOG.md", "/PERFORMANCE.md",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
directories = "6"
fst = "0.4"
levenshtein_automata = { version = "0.2", features = ["fst_automaton"] }
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"
# The idle timeout adapter uses ureq's unversioned transport interface.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "rustls-webpki-roots"] }
flate2 = "1"
tar = "0.4"
fs2 = "0.4"
signal-hook = "0.3"
tempfile = "3"

[[bin]]
name = "wordglide"
path = "src/main.rs"

[[bin]]
name = "dict-build"
path = "src/bin/dict-build.rs"

[[bin]]
name = "dict-bench"
path = "src/bin/dict-bench.rs"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
