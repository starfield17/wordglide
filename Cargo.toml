[package]
name = "local-english-dict"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Offline incremental English dictionary with immediate definition preview"
default-run = "wordglide"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
directories = "6"
fst = "0.4"
levenshtein_automata = { version = "0.2", features = ["fst_automaton"] }
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "wordglide"
path = "src/main.rs"

[[bin]]
name = "dict-build"
path = "src/bin/dict-build.rs"

[[bin]]
name = "dict-bench"
path = "src/bin/dict-bench.rs"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
