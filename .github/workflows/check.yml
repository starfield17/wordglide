name: Check
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: make check PYTHON=python3
      - name: Build release executables
        shell: bash
        run: |
          dict_sysroot="$(rustc --print sysroot)"
          RUSTFLAGS="--remap-path-prefix=$HOME=dependencies --remap-path-prefix=$PWD=workspace --remap-path-prefix=$dict_sysroot=toolchain" cargo build --release --bins
      - run: |
          ./target/release/dict-build --input examples/sample/entries.jsonl --source examples/sample/source.json --output data/ci-sample
          python3 scripts/terminal_smoke.py --data data/ci-sample
      - uses: actions/upload-artifact@v7
        with:
          name: dict-${{ matrix.os }}
          path: |
            target/release/wordglide
            target/release/dict-build
            target/release/dict-bench
