name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: cargo fmt --all -- --check
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
  msrv:
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --locked --all-targets
  check:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-${{ matrix.os }}
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc
      - name: Build debug executables and sample dictionary
        run: |
          cargo build --locked --bins
          target/debug/dict-build --input examples/sample/entries.jsonl --source examples/sample/source.json --output data/ci-sample
          target/debug/wordglide --data data/ci-sample --verify-data
      - name: Check terminal behavior
        run: |
          python3 scripts/terminal_no_data_smoke.py --binary target/debug/wordglide
          python3 scripts/terminal_smoke.py --binary target/debug/wordglide --data data/ci-sample
          python3 scripts/terminal_interaction_smoke.py --binary target/debug/wordglide --data data/ci-sample
          python3 scripts/terminal_appearance_smoke.py --binary target/debug/wordglide --data data/ci-sample
